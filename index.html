<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">

</head>
<body>
    <header class="titulo">
        <h1>Blackjack</h1>
    </header>
    <!-- Contenedor de botones -->
     <div class ="row mt-2">
        <div id="div-botones">
            <button id="btn-danger" type="button">Nuevo juego</button>
            <button id="btn-success" type="button">Pedir carta</button>
            <button id="btn-warning" type="button">Detener</button>
        </div>
     </div>
     <!-- Contenedor de cartas -->
            <main class="container">
                <section class="mesa">
                        <h2>Jugador 1 - <small id="puntos-jugador">0</small></h2>
                        <div id="cartas-jugador" class="cartas"></div>
                </section>
                <section class="mesa">
                        <h2>Computadora - <small id="puntos-computadora">0</small></h2>
                        <div id="cartas-computadora" class="cartas"></div>
                </section>
                <p id="mensaje" class="mensaje"></p>
            </main>
        <script src="https://cdn.jsdelivr.net/npm/underscore@1.13.8/underscore-umd-min.js"></script>
        <script src="assets/js/juego.js"></script>
    
</body>
</html>
